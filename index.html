<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>H5P Interaktív Lejátszó</title>
    <!-- A lejátszó stíluslapja -->
    <link rel="stylesheet" href="h5p-player/styles/h5p.css">
    <style>
        body { margin: 0; padding: 20px; background-color: #f5f5f5; font-family: sans-serif; }
        #h5p-container { max-width: 960px; margin: 0 auto; background: white; padding: 10px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <!-- A konténer, amiben a tartalom megjelenik -->
    <div id="h5p-container"></div>

    <!-- A fő lejátszó motor betöltése (Az Ön verziójához a .min.js fájl kell) -->
    <script src="h5p-player/h5p-standalone.min.js" charset="UTF-8"></script>
    
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const el = document.getElementById('h5p-container');
            
            // Konfiguráció
            const options = {
                id: 'interaktiv-video',
                h5pJsonPath: './h5p-tartalom',
                frameJs: 'h5p-player/frame.bundle.js',
                frameCss: 'h5p-player/styles/h5p.css'
            };
            
            // Lejátszó indítása az új, modern szintaxissal (H5PStandalone.H5P helyett simán new H5P)
            try {
                new H5P(el, options)
                    .then(() => console.log("H5P sikeresen inicializálva!"))
                    .catch(err => {
                        console.error("H5P betöltési hiba:", err);
                        el.innerHTML = "<p style='color:red; padding:20px;'>Hiba a tartalom beolvasásakor.</p>";
                    });
            } catch(e) {
                console.error("Kritikus hiba az indításkor:", e);
                el.innerHTML = "<p style='color:red; padding:20px;'>Nem sikerült elindítani a lejátszót.</p>";
            }
        });
    </script>
</body>
</html>
