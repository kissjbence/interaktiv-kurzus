<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>H5P Interaktív Lejátszó</title>
    <!-- A lejátszó stíluslapja -->
    <link rel="stylesheet" href="h5p-player/styles/h5p.css">
    <style>
        body { margin: 0; padding: 20px; background-color: #f5f5f5; font-family: sans-serif; }
        #h5p-container { max-width: 960px; margin: 0 auto; background: white; padding: 10px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <!-- A konténer, amiben az H5P megjelenik -->
    <div id="h5p-container"></div>

    <!-- 1. A fő indítófájl betöltése -->
    <script src="h5p-player/main.bundle.js" charset="UTF-8"></script>
    
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const el = document.getElementById('h5p-container');
            
            // Konfiguráció az Ön mappaszerkezetéhez szabva
            const options = {
                h5pJsonPath: './h5p-tartalom',
                frameJs: './h5p-player/frame.bundle.js',
                frameCss: './h5p-player/styles/h5p.css'
            };
            
            // Lejátszó indítása a megfelelő névterülettel (window.H5PStandalone)
            try {
                if (window.H5PStandalone && window.H5PStandalone.H5P) {
                    new window.H5PStandalone.H5P(el, options);
                    console.log("H5P script sikeresen elindult.");
                } else {
                    console.error("A H5PStandalone nem található. Hibás a main.bundle.js betöltése?");
                    el.innerHTML = "<p style='color:red; padding:20px;'>A lejátszó motorja nem töltődött be megfelelően.</p>";
                }
            } catch(e) {
                console.error("Kritikus hiba az indításkor:", e);
                el.innerHTML = "<p style='color:red; padding:20px;'>Nem sikerült inicializálni a lejátszót.</p>";
            }
        });
    </script>
</body>
</html>
